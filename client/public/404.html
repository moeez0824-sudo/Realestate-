<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PakEstate - Premier Real Estate Network</title>
    <script type="text/javascript">
      // GitHub Pages SPA Hash Redirect
      (function () {
        var repoName = '/Realestate';
        var pathname = window.location.pathname;
        var search = window.location.search || '';
        var hash = window.location.hash || '';

        // Extract the route relative to the repository path
        var route = pathname;
        if (route.indexOf(repoName) === 0) {
          route = route.substring(repoName.length);
        }
        if (route.charAt(0) === '/') {
          route = route.substring(1);
        }

        var redirectTarget = window.location.origin + repoName + '/#/' + route + search + hash;
        window.location.replace(redirectTarget);
      })();
    </script>
  </head>
  <body>
    <p style="font-family: sans-serif; text-align: center; margin-top: 50px;">
      Redirecting to <a href="/Realestate/">PakEstate</a>...
    </p>
  </body>
</html>
